apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      containers:
        - name: task-service
          image: mouhannad86/task-service:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_HOST
              value: mongodb
            - name: USER_SERVICE_HOST
              value: user-service
            - name: USER_SERVICE_PORT
              value: "5001"

---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: task-manager
spec:
  type: NodePort
  selector:
    app: task-service
  ports:
    - port: 5000
      targetPort: 5000