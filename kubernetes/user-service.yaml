apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: task-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: mouhannad86/user-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: task-manager
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 5001
      targetPort: 5001